trigger: none 
pr: none
pool: 
  name: terraform-agent

variables:
  webappName: 'webapp091'

stages:
  - stage: Build_UI_Artifacts
    displayName: Build artifact stage
    jobs:
      - job: Build_UI_Artifacts
        displayName: Build UI based artifcats for react App
        steps:
          # - checkout: self
          
          # - task: NodeTool@0
          #   displayName: Install Node Version 18.x
          #   inputs:
          #     versionSource: 'spec'
          #     versionSpec: '18.x'
          
          # - task: Npm@1
          #   displayName: npm Install
          #   inputs:
          #     command: 'install'
          #     workingDir: '$(System.DefaultWorkingDirectory)/'
          #     verbose: true
          
          # - task: Npm@1
          #   displayName: npm run build
          #   inputs:
          #     command: 'custom'
          #     workingDir: '$(System.DefaultWorkingDirectory)/'
          #     customCommand: 'run build'
          #     verbose: true

          - task: ArchiveFiles@2
            inputs:
              rootFolderOrFile: '$(System.DefaultWorkingDirectory)/build'
              includeRootFolder: true
              archiveType: 'zip'
              archiveFile: '$(Build.ArtifactStagingDirectory)/build.zip'
              replaceExistingArchive: true
          
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: '$(System.DefaultWorkingDirectory)/build.zip'
              artifact: 'Reactdrop'
              publishLocation: 'pipeline'
          
          

